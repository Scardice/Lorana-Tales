name: Nightly Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Production dependencies include native better-sqlite3 binaries.
          # Build with the minimum advertised, security-supported LTS runtime.
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm lint

      - name: Audit dependencies and security boundaries
        run: |
          pnpm audit
          pnpm test:security

      - name: Verify story format
        run: |
          pnpm test:story-format
          pnpm test:account-groups

      - name: Build server and frontend
        run: pnpm build

      - name: Stage portable runtime package
        run: node scripts/package-nightly.mjs release/lorana-tales-nightly

      - name: Deploy audited production dependency tree
        run: |
          pnpm --filter . deploy --prod --legacy release/runtime-dependencies
          cp -a release/runtime-dependencies/node_modules release/lorana-tales-nightly/node_modules

      - name: Verify staged runtime package
        working-directory: release/lorana-tales-nightly
        run: |
          test -f config.toml
          test -f dist/bin/scardice-story-painter.js
          test -f out/index.html
          test -f package.json
          test -d node_modules/.pnpm
          test -f OFFICIAL_BUILD.json
          test -f ecosystem.config.cjs
          test -f scripts/rolling-launcher.mjs
          node -e "const app=require('./ecosystem.config.cjs').apps?.[0]; if(app?.script !== require('node:path').join(process.cwd(),'scripts/rolling-launcher.mjs') || app?.exec_mode !== 'fork' || app?.instances !== 1) process.exit(1)"
          node --input-type=module -e "await import('better-sqlite3'); console.log('better-sqlite3 runtime loaded')"

      - name: Archive runtime package
        run: |
          tar -czf release/lorana-tales-nightly-linux-x64.tar.gz \
            -C release lorana-tales-nightly
          (cd release && zip -qr lorana-tales-nightly-linux-x64.zip lorana-tales-nightly)
          (cd release && sha256sum \
            lorana-tales-nightly-linux-x64.tar.gz \
            lorana-tales-nightly-linux-x64.zip \
            > SHA256SUMS.txt)

      - name: Delete previous Nightly release and recreate its tag
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/nightly" -f sha="$NIGHTLY_SHA" >/dev/null

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly Release
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Rolling nightly build for commit `${{ github.sha }}`.

            Target: Linux x64, Node.js >= 24.20.0 and < 25.
            The package contains compiled `dist/`, `out/`, production dependencies, and an editable `config.toml`.
          files: |
            release/lorana-tales-nightly-linux-x64.tar.gz
            release/lorana-tales-nightly-linux-x64.zip
            release/SHA256SUMS.txt
