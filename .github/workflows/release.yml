name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 0.1.0-testify.2 or 1.0.0
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: test
        type: choice
        options:
          - test
          - stable

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer-compatible version: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$RELEASE_CHANNEL" == "stable" && "$RELEASE_VERSION" == *-* ]]; then
            echo "Stable releases cannot use a prerelease version." >&2
            exit 1
          fi
          if [[ "$RELEASE_CHANNEL" == "test" && "$RELEASE_VERSION" != *-* ]]; then
            echo "Test releases must use a prerelease version such as 0.1.0-testify.2." >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_VERSION" > VERSION

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and story format
        run: |
          pnpm audit
          pnpm lint
          pnpm test:security
          pnpm test:story-format
          pnpm test:account-groups

      - name: Build server and frontend
        run: pnpm build

      - name: Stage portable runtime package
        env:
          LORANA_RELEASE_CHANNEL: ${{ inputs.channel == 'stable' && 'Release' || 'Test Release' }}
        run: node scripts/package-nightly.mjs "release/lorana-tales-${RELEASE_VERSION}"

      - name: Deploy audited production dependency tree
        run: |
          pnpm --filter . deploy --prod --legacy release/runtime-dependencies
          cp -a release/runtime-dependencies/node_modules release/lorana-tales-${RELEASE_VERSION}/node_modules

      - name: Verify staged runtime package
        working-directory: release/lorana-tales-${{ inputs.version }}
        run: |
          test -f VERSION
          test -f config.toml
          test -f dist/bin/scardice-story-painter.js
          test -f out/index.html
          test -f package.json
          test -d node_modules/.pnpm
          test -f OFFICIAL_BUILD.json
          test -f ecosystem.config.cjs
          test -f scripts/rolling-launcher.mjs
          node -e "const app=require('./ecosystem.config.cjs').apps?.[0]; if(app?.script !== require('node:path').join(process.cwd(),'scripts/rolling-launcher.mjs') || app?.exec_mode !== 'fork' || app?.instances !== 1) process.exit(1)"
          node --input-type=module -e "await import('better-sqlite3'); console.log('better-sqlite3 runtime loaded')"

      - name: Archive runtime package
        shell: bash
        run: |
          set -euo pipefail
          base="lorana-tales-${RELEASE_VERSION}-linux-x64"
          tar -czf "release/${base}.tar.gz" -C release "lorana-tales-${RELEASE_VERSION}"
          (cd release && zip -qr "${base}.zip" "lorana-tales-${RELEASE_VERSION}")
          (cd release && sha256sum "${base}.tar.gz" "${base}.zip" > "SHA256SUMS-${RELEASE_VERSION}.txt")

      - name: Publish retained GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lorana Tales ${{ inputs.version }}
          prerelease: ${{ inputs.channel == 'test' }}
          make_latest: ${{ inputs.channel == 'stable' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/lorana-tales-${{ inputs.version }}-linux-x64.tar.gz
            release/lorana-tales-${{ inputs.version }}-linux-x64.zip
            release/SHA256SUMS-${{ inputs.version }}.txt
